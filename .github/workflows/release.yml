name: Release Plugin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release WordPress Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Extract Plugin Version
        id: get_version
        run: |
          VERSION=$(grep -i "Version:" kommo-client-manager.php | head -n 1 | awk -F':' '{print $2}' | tr -d ' \r\n')
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
          fi

      - name: Install Composer Dependencies
        run: |
          if [ -f "composer.json" ]; then
            composer install --no-dev --optimize-autoloader --no-interaction
          fi

      - name: Create Plugin ZIP Package
        run: |
          mkdir -p build/kommo-client-manager
          rsync -rc --exclude='.git*' --exclude='.github' --exclude='build' ./ build/kommo-client-manager/
          cd build
          zip -r ../kommo-client-manager.zip kommo-client-manager/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: kommo-client-manager.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


